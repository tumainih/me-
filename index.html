<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LOVE — Time · Matter · Space</title>
<meta name="description" content="An offline hierarchical life-recording, variable-tracking, location-history and analysis system.">
<meta name="theme-color" content="#F7F8FA">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <header class="bar">
    <div class="brand">
      <span class="brand-mark">L</span>
      <span class="brand-name">LOVE</span>
    </div>
    <div class="bar-clock readout" id="barClock">--:--:--.---</div>
    <span class="offline-dot" id="offlineDot">● LOCAL DATA ACTIVE</span>
  </header>

  <div class="perm-banner" id="permBanner" style="display:none">
    <span>LOVE can record where you were automatically — no form to fill.</span>
    <div class="perm-actions">
      <button class="btn btn-sm btn-space" id="grantLocBtn">Enable location</button>
      <button class="btn btn-sm" id="dismissPermBtn">Not now</button>
    </div>
  </div>

  <div id="verseBanner"></div>

  <main id="mainView"></main>

  <nav class="tabbar" role="tablist" aria-label="Primary sections">
    <button class="tab active" data-tab="time" role="tab" aria-selected="true"><span class="tab-glyph">◔</span><span>Time</span></button>
    <button class="tab" data-tab="matter" role="tab" aria-selected="false"><span class="tab-glyph">◆</span><span>Matter</span></button>
    <button class="tab" data-tab="space" role="tab" aria-selected="false"><span class="tab-glyph">⬡</span><span>Space</span></button>
    <button class="tab" data-tab="fetch" role="tab" aria-selected="false"><span class="tab-glyph">🔍</span><span>Fetch</span></button>
    <button class="tab" data-tab="analyse" role="tab" aria-selected="false"><span class="tab-glyph">📊</span><span>Analyse</span></button>
    <button class="tab" data-tab="export" role="tab" aria-selected="false"><span class="tab-glyph">⬇</span><span>Export</span></button>
    <button class="tab" data-tab="settings" role="tab" aria-selected="false"><span class="tab-glyph">⚙</span><span>Settings</span></button>
  </nav>
</div>

<div id="modalRoot"></div>

<script src="js/db.js"></script>
<script src="js/time.js"></script>
<script src="js/verses.js"></script>
<script src="js/location.js"></script>
<script src="js/vocabulary.js"></script>
<script src="js/record.js"></script>
<script src="js/views/time-view.js"></script>
<script src="js/views/matter-view.js"></script>
<script src="js/views/space-view.js"></script>
<script src="js/views/fetch-view.js"></script>
<script src="js/views/analyse-view.js"></script>
<script src="js/views/export-view.js"></script>
<script src="js/views/settings-view.js"></script>
<script src="js/app.js"></script>
</body>
</html>
